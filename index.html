<button id="launch-btn" class="your-button-styles">
    >_ LAUNCH ANALYZER
</button>

<div id="terminal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; padding: 50px; font-family: monospace; color: #a277ff;">
    <div id="terminal-content"></div>
</div>

<script>
document.getElementById('launch-btn').addEventListener('click', function() {
    const overlay = document.getElementById('terminal-overlay');
    const content = document.getElementById('terminal-content');
    overlay.style.display = 'block';
    content.innerHTML = '';

    const lines = [
        "$ HEX_SPECTER --SCAN PAYLOAD.PNG --DEEP --RECURSIVE",
        "[INIT] LOADING FORENSIC ENGINE...",
        "[SCAN] VERIFYING FILE STRUCTURE...",
        "[ALERT] SIGNATURE MISMATCH DETECTED",
        "[SCAN] SEARCHING FOR EMBEDDED DATA...",
        "[ALERT] HIDDEN PAYLOAD FOUND - LAYER 2",
        "[DEEP] ENTERING NESTED ARCHIVE...",
        "[DONE] 3 CONCEALED LAYERS EXPOSED"
    ];

    let i = 0;
    function typeLine() {
        if (i < lines.length) {
            content.innerHTML += lines[i] + "<br>";
            i++;
            setTimeout(typeLine, 800); // Adjust speed here
        }
    }
    typeLine();
});
</script><button id="launch-btn" class="your-button-styles">
